<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Hexagon border shield -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
  
  <!-- Trending Growth Lines & FinanFlow Logo Symbol -->
  <path d="M140 330 L210 250 L280 290 L370 170" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head -->
  <path d="M310 170 L370 170 L370 230" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized Currency Coin / Node -->
  <circle cx="210" cy="250" r="16" fill="#10b981" />
  <circle cx="280" cy="290" r="16" fill="#06b6d4" />
  <circle cx="140" cy="330" r="16" fill="#38bdf8" />

  <!-- Subtitle Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">FINANFLOW</text>
</svg>
